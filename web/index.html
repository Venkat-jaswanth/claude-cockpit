<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Claude Cockpit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0e12'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%23e6c878' stroke-width='1.6'/%3E%3Cpath d='M16 9.5 L21 16 L16 22.5 L11 16 Z' fill='%23e6c878'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="ckMark" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#f5e2a8"/><stop offset=".55" stop-color="#e6c878"/><stop offset="1" stop-color="#c2a24d"/></linearGradient></defs><circle cx="12" cy="12" r="8.6" stroke="url(#ckMark)" stroke-width="1.3" opacity=".88"/><path d="M12 7.3 L15.7 11 L12 16.7 L8.3 11 Z" fill="url(#ckMark)"/><path d="M8.3 11 H15.7" stroke="#1a1406" stroke-width=".9" opacity=".45"/><path d="M12 7.3 V16.7" stroke="#1a1406" stroke-width=".7" opacity=".3"/></svg></span><div><div class="brand-name">cockpit</div><div class="brand-sub" id="brandSub">connecting…</div></div></div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-view="overview"><span class="ico">◉</span>Overview<span class="count" id="cAttn"></span></a>
      <a href="#/seats" data-view="seats"><span class="ico">◫</span>Seats<span class="count" id="cSeats"></span></a>
      <a href="#/sessions" data-view="sessions"><span class="ico">▶</span>Sessions<span class="count" id="cSessions"></span></a>
      <a href="#/tasks" data-view="tasks"><span class="ico">☑</span>Tasks<span class="count" id="cTasks"></span></a>
      <a href="#/projects" data-view="projects"><span class="ico">▦</span>Projects<span class="count" id="cProjects"></span></a>
      <a href="#/workspace" data-view="workspace"><span class="ico">⊞</span>Workspace</a>
      <a href="#/library" data-view="library"><span class="ico">▥</span>Library<span class="count" id="cLibrary"></span></a>
      <a href="#/usage" data-view="usage"><span class="ico">▤</span>Usage</a>
      <a href="#/activity" data-view="activity"><span class="ico">◷</span>Activity</a>
      <div class="nav-gap"></div>
      <a href="#/settings" data-view="settings"><span class="ico">⚙</span>Settings</a>
      <a href="#/help" data-view="help"><span class="ico">?</span>Help</a>
    </nav>
    <div class="sidebar-foot" id="daemonLine">daemon…</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 id="viewTitle">Overview</h1><div class="topbar-sub" id="viewSub"></div></div>
      <div class="topbar-actions">
        <button class="btn" id="btnCheckAll" title="Opens Claude Code briefly on every idle seat, asks it for /usage, and closes it. No prompt is sent.">Check usage</button>
        <button class="btn primary" id="btnNew">New session</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="scrim" id="sheetScrim" hidden>
  <form class="sheet" id="newSession" role="dialog" aria-modal="true" aria-label="New session">
    <div class="sheet-head"><h2>New session</h2><button type="button" class="btn ghost" id="sheetClose" aria-label="Close">✕</button></div>
    <label class="field"><span>Project</span><select name="projectId" id="nsProject"></select></label>
    <label class="field"><span>Folder</span><input name="cwd" list="projects" placeholder="/Users/you/project" autocomplete="off" required><datalist id="projects"></datalist></label>
    <div class="field-row">
      <label class="field"><span>Seat</span><select name="seat" id="nsSeat"><option value="">Best seat</option></select></label>
      <label class="field"><span>Name</span><input name="name" placeholder="optional"></label>
    </div>
    <label class="field"><span>Extra Claude Code flags</span><input name="extra" placeholder="--model opus" autocomplete="off"></label>
    <label class="field inline"><input type="checkbox" name="worktree" id="nsWorktree"><span>Run in an isolated git worktree, so parallel sessions on the same repo never collide</span></label>
    <label class="field" id="nsBranchWrap" style="display:none"><span>New branch <span class="muted">(optional; blank checks out the current HEAD)</span></span><input name="branch" placeholder="e.g. feature/payments" autocomplete="off"></label>
    <div class="field-row">
      <label class="field"><span>Start</span><select name="when" id="nsWhen"><option value="now">Now</option><option value="3600000">In 1 hour</option><option value="7200000">In 2 hours</option><option value="14400000">In 4 hours</option><option value="reset">At the freshest seat's next reset</option></select></label>
      <label class="field"><span>Initial task <span class="muted">(optional — runs on start)</span></span><input name="prompt" placeholder="e.g. continue the refactor" autocomplete="off"></label>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn" id="nsBrowser">Open in browser</button>
      <button type="submit" class="btn primary" id="nsSubmit">Open in Terminal</button>
    </div>
  </form>
</div>
<div class="scrim" id="projScrim" hidden>
  <form class="sheet sheet-sm" id="newProject" role="dialog" aria-modal="true" aria-label="New project">
    <div class="sheet-head"><h2 id="projTitle">New project</h2><button type="button" class="btn ghost" id="projClose" aria-label="Close">✕</button></div>
    <label class="field"><span>Name</span><input name="pname" placeholder="e.g. Checkout API" autocomplete="off" required></label>
    <div class="field"><span>Folder <span class="muted">(optional)</span></span>
      <div class="seg" id="projFolderMode">
        <button type="button" data-fm="existing" class="on">Use existing</button>
        <button type="button" data-fm="new">Create new</button>
        <button type="button" data-fm="none">No folder</button>
      </div>
    </div>
    <label class="field" id="projFolderWrap"><input name="pfolder" list="projFolders" placeholder="~/code/checkout-api" autocomplete="off"><datalist id="projFolders"></datalist><span class="field-hint" id="projFolderHint"></span></label>
    <label class="field"><span>Tags <span class="muted">(optional, comma separated)</span></span><input name="ptags" placeholder="backend, billing" autocomplete="off"></label>
    <div class="sheet-foot">
      <button type="button" class="btn" id="projCancel">Cancel</button>
      <button type="submit" class="btn primary" id="projSubmit">Create project</button>
    </div>
  </form>
</div>

<div class="toasts" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
